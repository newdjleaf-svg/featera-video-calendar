<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FEATERA 影音課程行事曆</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f4;color:#172b25;font:16px system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header img{width:180px}h1{font-size:clamp(20px,3vw,32px);margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid #cad4ce;border-radius:7px;background:white;padding:9px 13px;color:inherit}button:hover{background:#e7f1eb}.primary{background:#00633d;color:white}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 10px}.scroll{overflow-x:auto}.calendar{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));min-width:900px;background:white;border:1px solid #aab7b0;gap:1px;background:#aab7b0}.weekday{text-align:center;background:#e9efeb;padding:10px;font-weight:bold}.day{background:white;min-height:140px;padding:9px;min-width:0}.blank{background:#f1f3f2}.red{color:#c52232}.date{display:flex;justify-content:space-between;align-items:center;gap:5px}.date button{padding:2px 8px}.holiday{font-size:12px;color:#b02030;overflow-wrap:anywhere}.card{margin-top:8px;border:1px solid #dce4df;border-radius:7px;overflow:hidden;background:#f8faf9}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#dfe5e1}.card a{display:block;text-decoration:none;color:inherit}.title{padding:8px;overflow-wrap:anywhere;font-size:14px;line-height:1.5}.actions{display:flex;gap:4px;padding:0 6px 6px}.actions button{font-size:12px;padding:4px 8px}dialog{border:0;border-radius:14px;width:min(500px,94%);padding:24px;box-shadow:0 12px 50px #0003}dialog::backdrop{background:#0006}label{display:block;margin:14px 0 5px}input{width:100%;padding:10px;border:1px solid #b9c8be;border-radius:6px}#preview{width:100%;max-height:200px;object-fit:contain;margin:8px 0}#status,#msg,footer{font-size:13px;color:#53665b}footer{margin-top:16px}@media print{body{background:white}main{padding:0}.toolbar,button,footer,#status{display:none!important}.calendar{min-width:0;grid-template-columns:repeat(7,1fr)}.day{min-height:90px}.scroll{overflow:visible}.card{break-inside:avoid}}
</style><main><header><img src="logo.png" alt="FEATERA"><h1 id="heading"></h1><div>影音課程行事曆</div></header><div class="toolbar"><button id="prev">‹ 上月</button><button id="today">今天</button><button id="next">下月 ›</button><input id="month" type="month" style="width:auto"><button id="print">列印 / PDF</button><button id="export">備份資料</button><button id="login">管理員登入</button><button id="logout" hidden>登出</button><input type="file" id="file" accept="application/json" hidden></div><p id="status" aria-live="polite"></p><div class="scroll"><div class="calendar" id="grid"></div></div><footer>點選日期的 ＋ 新增影片，點選縮圖前往 YouTube。課程資料由雲端資料庫同步。</footer></main><dialog id="auth"><form id="authform"><h2>管理員登入</h2><label>帳號<input id="username" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><p id="authmsg"></p><button class="primary">登入</button> <button type="button" id="authcancel">取消</button></form></dialog><dialog id="modal"><form id="form"><h2 id="dateLabel"></h2><label for="url">YouTube 影片連結</label><input id="url" type="url" required placeholder="https://youtu.be/…"><button type="button" id="read" style="margin-top:8px">重新讀取影片資訊</button><p id="msg" aria-live="polite"></p><img id="preview" hidden alt="影片縮圖"><label for="title">課程標題（可修改）</label><input id="title" required maxlength="300"><div style="display:flex;gap:8px;margin-top:20px"><button class="primary">儲存課程</button><button type="button" id="cancel">取消</button></div></form></dialog><script>
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0'), key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;let now=new Date(),y=now.getFullYear(),m=now.getMonth(),data={},hol={},active='',editing=-1,seq=0,hseq=0,thumb='',vid='';let admin=false;async function load(){let r=await fetch('/api/courses');if(!r.ok)throw Error('資料載入失敗');data=await r.json();render()}async function save(k,v){let r=await fetch('/api/courses/'+k,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});if(!r.ok)throw Error('儲存失敗，請確認登入及網路');await load()}async function init(){try{let r=await fetch('/api/session');admin=(await r.json()).admin;controls();await load()}catch(e){alert(e.message)}}function controls(){$('login').hidden=admin;$('logout').hidden=!admin;$('export').hidden=!admin;render()}$('login').onclick=()=>{$('authmsg').textContent='';$('auth').showModal()};$('authcancel').onclick=()=>$('auth').close();$('authform').onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});if(!r.ok)throw Error('登入失敗');admin=true;$('password').value='';$('auth').close();controls();await load()}catch(e){$('authmsg').textContent=e.message}};$('logout').onclick=async()=>{try{let r=await fetch('/api/logout',{method:'POST'});if(!r.ok)throw Error('登出失敗');admin=false;controls()}catch(e){alert(e.message)}};function idOf(v){try{let u=new URL(v),h=u.hostname.toLowerCase(),p=u.pathname.split('/').filter(Boolean),i=h==='youtu.be'?p[0]:['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(h)?(u.searchParams.get('v')||(['shorts','live','embed'].includes(p[0])?p[1]:'')):'';return /^[\w-]{11}$/.test(i||'')?i:''}catch{return ''}}function el(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n}function render(){ $('heading').textContent=`${y} 年 ${m+1} 月行事曆`;$('month').value=`${y}-${pad(m+1)}`;let g=$('grid');g.replaceChildren();['一','二','三','四','五','六','日'].forEach((s,i)=>g.append(el('div','weekday '+(i>4?'red':''),'星期'+s)));let offset=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),total=Math.ceil((offset+n)/7)*7;for(let j=0;j<total;j++){let d=j-offset+1,c=el('div','day');g.append(c);if(d<1||d>n){c.classList.add('blank');continue}let k=key(y,m,d),h=hol[k],off=h?h.isHoliday:j%7>4;let head=el('div','date '+(off?'red':'')),b=el('button','','＋');b.title='新增課程 '+k;b.onclick=()=>openEdit(k,-1);head.append(el('strong','',String(d)));if(admin)head.append(b);c.append(head);if(h&&h.description)c.append(el('div','holiday',h.description));if(h&&!h.isHoliday&&j%7>4)c.append(el('div','holiday','補班 / 上班'));(data[k]||[]).forEach((v,i)=>{let card=el('div','card'),a=el('a'),img=el('img');a.href='https://www.youtube.com/watch?v='+v.id;a.target='_blank';a.rel='noopener noreferrer';img.src='https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg';img.alt=v.title;img.loading='lazy';a.append(img,el('div','title',v.title));let ac=el('div','actions'),e=el('button','','修改'),del=el('button','','刪除');e.onclick=()=>openEdit(k,i);del.onclick=async()=>{if(confirm('刪除此課程？')){try{await save(k,data[k].filter((_,j)=>j!==i))}catch(e){alert(e.message)}}};ac.append(e,del);card.append(a);if(admin)card.append(ac);c.append(card)})}}async function holidays(){let token=++hseq;hol={};render();$('status').textContent='正在讀取台灣假日資料…';try{let r=await fetch('/api/holidays?year='+y);if(!r.ok)throw Error();let a=await r.json();if(!Array.isArray(a)||!a.length)throw Error();if(token!==hseq)return;for(let h of a){let d=String(h.date).replace(/-/g,'');hol[d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8)]=h}$('status').textContent='台灣政府辦公日曆資料已載入（含補假及補班）';render()}catch{if(token===hseq)$('status').textContent='假日資料未能取得，目前僅標示週末，非完整國定假日。'}}function move(n){let d=new Date(y,m+n,1);y=d.getFullYear();m=d.getMonth();holidays()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>{now=new Date();y=now.getFullYear();m=now.getMonth();holidays()};$('month').onchange=()=>{let a=$('month').value.split('-').map(Number);if(a[0]>=2000&&a[0]<=2099){y=a[0];m=a[1]-1;holidays()}};function openEdit(k,i){seq++;active=k;editing=i;let v=(data[k]||[])[i];$('dateLabel').textContent=k+' 課程';$('url').value=v?'https://www.youtube.com/watch?v='+v.id:'';$('title').value=v?.title||'';vid=v?.id||'';$('msg').textContent='';show();$('modal').showModal()}function show(){$('preview').hidden=!vid;if(vid)$('preview').src='https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg';else $('preview').removeAttribute('src')}async function read(){let t=++seq,i=idOf($('url').value);vid=i;show();if(!i){$('msg').textContent='請輸入有效的 YouTube 單一影片網址';return}let old=$('title').value;$('msg').textContent='正在讀取標題…';try{let r=await fetch('/api/video?id='+i);if(!r.ok)throw Error();let v=await r.json();if(t!==seq)return;if($('title').value===old)$('title').value=v.title;$('msg').textContent='已讀取，可自行修改標題。'}catch{if(t===seq)$('msg').textContent='無法自動讀取標題，請手動輸入；縮圖仍會嘗試載入。'}}$('url').addEventListener('change',read);$('url').addEventListener('paste',()=>setTimeout(read,0));$('read').onclick=read;$('cancel').onclick=()=>{seq++;$('modal').close()};$('modal').addEventListener('close',()=>seq++);$('form').onsubmit=async e=>{e.preventDefault();let i=idOf($('url').value),title=$('title').value.trim();if(!i||!title){$('msg').textContent='請確認影片連結與標題';return}let a=[...(data[active]||[])];let v={id:i,title};if(editing<0)a.push(v);else a[editing]=v;try{await save(active,a);$('modal').close()}catch(e){$('msg').textContent=e.message}};$('print').onclick=()=>window.print();$('export').onclick=()=>{let a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='featera-calendar-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};holidays();init();
</script></html>
