<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FEATERA 影音課程行事曆</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f4;color:#172b25;font:16px system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header img{width:180px;max-height:100px;object-fit:contain;object-position:left center} .playlistbadge{padding:5px 8px;background:#164b37;color:white;font-size:12px} .placeholder{aspect-ratio:16/9;display:grid;place-items:center;background:#e0e9e4;font-size:14px}h1{font-size:clamp(20px,3vw,32px);margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid #cad4ce;border-radius:7px;background:white;padding:9px 13px;color:inherit}button:hover{background:#e7f1eb}.primary{background:#00633d;color:white}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 10px}.scroll{overflow-x:auto}.calendar{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));min-width:900px;background:white;border:1px solid #aab7b0;gap:1px;background:#aab7b0}.weekday{text-align:center;background:#e9efeb;padding:10px;font-weight:bold}.day{background:white;min-height:140px;padding:9px;min-width:0}.blank{background:#f1f3f2}.red{color:#c52232}.date{display:flex;justify-content:space-between;align-items:center;gap:5px}.date button{padding:2px 8px}.holiday{font-size:12px;color:#b02030;overflow-wrap:anywhere}.card{margin-top:8px;border:1px solid #dce4df;border-radius:7px;overflow:hidden;background:#f8faf9}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#dfe5e1}.card a{display:block;text-decoration:none;color:inherit}.title{padding:8px;overflow-wrap:anywhere;font-size:14px;line-height:1.5}.actions{display:flex;gap:4px;padding:0 6px 6px}.actions button{font-size:12px;padding:4px 8px}dialog{border:0;border-radius:14px;width:min(500px,94%);padding:24px;box-shadow:0 12px 50px #0003}dialog::backdrop{background:#0006}label{display:block;margin:14px 0 5px}input{width:100%;padding:10px;border:1px solid #b9c8be;border- </style><main><header><div id="brandBox"><div id="brandArea"><img id="brandLogo" src="/api/logo" alt="FEATERA"></div><div id="brandControls" hidden><button id="uploadLogo">更換 LOGO</button><button id="resetLogo">恢復預設</button></div></div><h1 id="heading"></h1><div>影音課程行事曆</div></header><div class="toolbar"><button id="prev">‹ 上月</button><button id="today">今天</button><button id="next">下月 ›</button><input id="month" type="month" style="width:auto"><button id="print">列印 / PDF</button><button id="export">備份資料</button><button id="login">管理員登入</button><button id="logout" hidden>登出</button><input type="file" id="file" accept="application/json" hidden></div><p id="status" aria-live="polite"></p><div class="scroll"><div class="calendar" id="grid"></div></div><footer>點選日期的 ＋ 新增影片，點選縮圖前往 YouTube。課程資料由雲端資料庫同步。</footer></main><dialog id="logoDialog"><form id="logoForm"><h2>LOGO 設定</h2><label>選擇圖片（PNG / JPG / WebP，20 MB 內）<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></label><div id="logoPreviewArea"><img id="logoPreview" alt="LOGO 預覽"></div><label>顯示寬度 <output id="lwOut"></output><input id="lw" type="range" min="80" max="400"></label><label>向右偏移 <output id="lxOut"></output><input id="lx" type="range" min="0" max="100"></label><label>向下偏移 <output id="lyOut"></output><input id="ly" type="range" min="0" max="60"></label><p id="logoMsg" aria-live="polite"></p><button class="primary" id="logoSave">儲存設定</button> <button type="button" id="logoCancel">取消</button></form></dialog><dialog id="auth"><form id="authform"><h2>管理員登入</h2><label>帳號<input id="username" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><p id="authmsg"></p><button class="primary">登入</button> <button type="button" id="authcancel">取消</button></form></dialog><dialog id="modal"><form id="form"><h2 id="dateLabel"></h2><label for="url">YouTube 影片／播放清單連結</label><label><input id="asPlaylist" type="checkbox" style="width:auto"> 有播放清單時，以整份清單新增</label><input id="url" type="url" required placeholder="https://youtu.be/…"><button type="button" id="read" style="margin-top:8px">重新讀取 YouTube 資訊</button><p id="msg" aria-live="polite"></p><img id="preview" hidden alt="影片縮圖"><label for="title">課程標題（可修改）</label><input id="title" required maxlength="300"><div style="display:flex;gap:8px;margin-top:20px"><button class="primary">儲存課程</button><button type="button" id="cancel">取消</button></div></form></dialog><script>
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0'), key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;let now=new Date(),y=now.getFullYear(),m=now.getMonth(),data={},hol={},active='',editing=-1,seq=0,hseq=0,thumb='',vid='';let admin=false,meta={};
function linkOf(v){return v.kind==='playlist'?'https://www.youtube.com/playlist?list='+encodeURIComponent(v.id):'https://www.youtube.com/watch?v='+v.id}
function targetOf(value){try{let u=new URL(value),l=u.searchParams.get('list'),h=u.hostname.toLowerCase();if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtu.be'].includes(h)&&/^[A-Za-z0-9_-]{2,150}$/.test(l||'')&&($('asPlaylist').checked||!idOf(value)))return {kind:'playlist',id:l};let id=idOf(value);return id?{kind:'video',id}:null}catch{return null}}
function thumbnail(v){return v.kind==='playlist'?(v.thumbnail||''):'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg'}
let logoLayout={width:180,x:0,y:0}, logoBlob=null, logoObject='', logoSeq=0;
function applyLogo(){let a=$('brandArea');a.style.setProperty('--lw',logoLayout.width+'px');a.style.setProperty('--lx',logoLayout.x+'px');a.style.setProperty('--ly',logoLayout.y+'px')}
async function loadLogo(){let r=await fetch('/api/logo/layout',{cache:'no-store'});if(!r.ok)throw Error('無法讀取 LOGO 設定');logoLayout=await r.json();applyLogo();$('brandLogo').src='/api/logo?t='+Date.now()}
function previewLayout(){for(let k of ['w','x','y'])$('l'+k+'Out').textContent=$('l'+k).value+' px';let im=$('logoPreview');im.style.width=$('lw').value+'px';im.style.marginLeft=$('lx').value+'px';im.style.marginTop=$('ly').value+'px';im.style.maxWidth='calc(100% - '+$('lx').value+'px)'}
for(let k of ['lw','lx','ly'])$(k).oninput=previewLayout;
$('uploadLogo').onclick=()=>{logoBlob=null;$('logoFile').value='';$('logoMsg').textContent='';$('lw').value=logoLayout.width;$('lx').value=logoLayout.x;$('ly').value=logoLayout.y;$('logoPreview').src=$('brandLogo').src;previewLayout();$('logoDialog').showModal()};
$('logoFile').onchange=async()=>{let token=++logoSeq,f=$('logoFile').files[0];logoBlob=null;$('logoPreview').src=$('brandLogo').src;if(!f)return;$('logoSave').disabled=true;try{if(f.size>20000000)throw Error('圖片超過 20 MB');let url=URL.createObjectURL(f),im=new Image();try{im.src=url;await im.decode();if(im.naturalWidth*im.naturalHeight>80000000)throw Error('圖片超過 8000 萬像素，請先縮小');let scale=Math.min(1,1200/im.naturalWidth,600/im.naturalHeight),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob)throw Error('圖片壓縮失敗');if(token!==logoSeq)return;logoBlob=blob;if(logoObject)URL.revokeObjectURL(logoObject);logoObject=URL.createObjectURL(blob);$('logoPreview').src=logoObject;$('logoMsg').textContent='已自動縮放為 '+c.width+' × '+c.height+' px，保留透明背景。'}finally{URL.revokeObjectURL(url)}}catch(e){if(token===logoSeq){$('logoMsg').textContent=e.message;$('logoFile').value=''}}finally{if(token===logoSeq)$('logoSave').disabled=false}};
$('logoCancel').onclick=()=>$('logoDialog').close();$('logoDialog').addEventListener('close',()=>{logoSeq++;logoBlob=null;if(logoObject)URL.revokeObjectURL(logoObject);logoObject='';$('logoSave').disabled=false});
async function logoRequest(method,body){let r=await fetch('/api/logo',{method,body});if(!r.ok){let x=await r.json().catch(()=>({}));throw Error(x.error||'請求失敗 HTTP '+r.status)}}
$('logoForm').onsubmit=async e=>{e.preventDefault();$('logoSave').disabled=true;try{let b=new FormData();if(logoBlob)b.append('logo',logoBlob,'logo.png');for(let [k,id] of [['width','lw'],['x','lx'],['y','ly']])b.append(k,$(id).value);await logoRequest('POST',b);await loadLogo();$('logoDialog').close()}catch(e){$('logoMsg').textContent=e.message}finally{$('logoSave').disabled=false}};
$('resetLogo').onclick=async()=>{if(!confirm('恢復預設 LOGO 及位置？'))return;try{await logoRequest('DELETE');await loadLogo()}catch(e){alert(e.message)}};loadLogo().catch(e=>console.warn(e.message));
async function load(){let r=await fetch('/api/courses');if(!r.ok)throw Error('資料載入失敗');data=await r.json();render()}async function save(k,v){let r=await fetch('/api/courses/'+k,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});if(!r.ok)throw Error('儲存失敗，請確認登入及網路');await load()}async function init(){try{let r=await fetch('/api/session');admin=(await r.json()).admin;controls();await load()}catch(e){alert(e.message)}}function controls(){$('brandControls').hidden=!admin;$('login').hidden=admin;$('logout').hidden=!admin;$('export').hidden=!admin;render()}$('login').onclick=()=>{$('authmsg').textContent='';$('auth').showModal()};$('authcancel').onclick=()=>$('auth').close();$('authform').onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});if(!r.ok)throw Error('登入失敗');admin=true;$('password').value='';$('auth').close();controls();await load()}catch(e){$('authmsg').textContent=e.message}};$('logout').onclick=async()=>{try{let r=await fetch('/api/logout',{method:'POST'});if(!r.ok)throw Error('登出失敗');admin=false;controls()}catch(e){alert(e.message)}};function idOf(v){try{let u=new URL(v),h=u.hostname.toLowerCase(),p=u.pathname.split('/').filter(Boolean),i=h==='youtu.be'?p[0]:['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(h)?(u.searchParams.get('v')||(['shorts','live','embed'].includes(p[0])?p[1]:'')):'';return /^[\w-]{11}$/.test(i||'')?i:''}catch{return ''}}function el(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n}function render(){ $('heading').textContent=`${y} 年 ${m+1} 月行事曆`;$('month').value=`${y}-${pad(m+1)}`;let g=$('grid');g.replaceChildren();['一','二','三','四','五','六','日'].forEach((s,i)=>g.append(el('div','weekday '+(i>4?'red':''),'星期'+s)));let offset=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),total=Math.ceil((offset+n)/7)*7;for(let j=0;j<total;j++){let d=j-offset+1,c=el('div','day');g.append(c);if(d<1||d>n){c.classList.add('blank');continue}let k=key(y,m,d),h=hol[k],off=h?h.isHoliday:j%7>4;let head=el('div','date '+(off?'red':'')),b=el('button','','＋');b.title='新增課程 '+k;b.onclick=()=>openEdit(k,-1);head.append(el('strong','',String(d)));if(admin)head.append(b);c.append(head);if(h&&h.description)c.append(el('div','holiday',h.description));if(h&&!h.isHoliday&&j%7>4)c.append(el('div','holiday','補班 / 上班'));(data[k]||[]).forEach((v,i)=>{let card=el('div','card'),a=el('a'),img=el('img');a.href=linkOf(v);a.target='_blank';a.rel='noopener noreferrer';let src=thumbnail(v);img.alt=v.title;img.loading='lazy';if(src){img.src=src;a.append(img);img.onerror=()=>img.replaceWith(el('div','placeholder','縮圖無法載入'))}else a.append(el('div','placeholder','YouTube 播放清單'));if(v.kind==='playlist')a.append(el('div','playlistbadge','播放清單'+(Number.isInteger(v.count)?' · '+v.count+' 部影片':'')));a.append(el('div','title',v.title));let ac=el('div','actions'),e=el('button','','修改'),del=el('button','','刪除');e.onclick=()=>openEdit(k,i);del.onclick=async()=>{if(confirm('刪除此課程？')){try{await save(k,data[k].filter((_,j)=>j!==i))}catch(e){alert(e.message)}}};ac.append(e,del);card.append(a);if(admin)card.append(ac);c.append(card)})}}async function holidays(){let token=++hseq;hol={};render();$('status').textContent='正在讀取台灣假日資料…';try{let r=await fetch('/api/holidays?year='+y);if(!r.ok)throw Error();let a=await r.json();if(!Array.isArray(a)||!a.length)throw Error();if(token!==hseq)return;for(let h of a){let d=String(h.date).replace(/-/g,'');hol[d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8)]=h}$('status').textContent='台灣政府辦公日曆資料已載入（含補假及補班）';render()}catch{if(token===hseq)$('status').textContent='假日資料未能取得，目前僅標示週末，非完整國定假日。'}}function move(n){let d=new Date(y,m+n,1);y=d.getFullYear();m=d.getMonth();holidays()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>{now=new Date();y=now.getFullYear();m=now.getMonth();holidays()};$('month').onchange=()=>{let a=$('month').value.split('-').map(Number);if(a[0]>=2000&&a[0]<=2099){y=a[0];m=a[1]-1;holidays()}};function openEdit(k,i){seq++;active=k;editing=i;let v=(data[k]||[])[i];$('dateLabel').textContent=k+' 課程';$('url').value=v?linkOf(v):'';$('asPlaylist').checked=v?.kind==='playlist';$('title').value=v?.title||'';meta=v?{...v,kind:v.kind||'video'}:{};$('msg').textContent='';show();$('modal').showModal()}
function show(){let src=meta.id?thumbnail(meta):'';$('preview').hidden=!src;if(src)$('preview').src=src;else $('preview').removeAttribute('src')}
async function read(){let t=++seq,v=targetOf($('url').value);if(!v){meta={};show();$('msg').textContent='請輸入有效 YouTube 網址';return}if(meta.id!==v.id||meta.kind!==v.kind)meta=v;show();let old=$('title').value;$('msg').textContent='正在讀取資訊…';try{let r=await fetch('/api/'+(v.kind==='playlist'?'playlist':'video')+'?id='+encodeURIComponent(v.id));let x=await r.json();if(!r.ok)throw Error(x.error||'讀取失敗');if(t!==seq)return;meta={...v,...(v.kind==='playlist'?{thumbnail:x.thumbnail,count:x.count}:{})};show();if($('title').value===old)$('title').value=x.title;$('msg').textContent='已讀取，可自行修改標題。'}catch(e){if(t===seq)$('msg').textContent=e.message+'；可手動輸入標題儲存。'}}
$('url').addEventListener('input',()=>{seq++;let v=targetOf($('url').value);if(!v||v.id!==meta.id||v.kind!==meta.kind){meta=v||{};show()}});$('url').addEventListener('change',read);$('url').addEventListener('paste',()=>setTimeout(read,0));$('asPlaylist').onchange=read;$('read').onclick=read;$('cancel').onclick=()=>{seq++;$('modal').close()};$('modal').addEventListener('close',()=>seq++);$('form').onsubmit=async e=>{e.preventDefault();let v=targetOf($('url').value),title=$('title').value.trim();if(!v||!title){$('msg').textContent='請確認連結與標題';return}let a=[...(data[active]||[])];let item={...(meta.id===v.id&&meta.kind===v.kind?meta:{}),...v,title};if(editing<0)a.push(item);else a[editing]=item;try{await save(active,a);$('modal').close()}catch(e){$('msg').textContent=e.message}};$('print').onclick=()=>window.print();$('export').onclick=()=>{let a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='featera-calendar-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};holidays();init();
</script></html>
